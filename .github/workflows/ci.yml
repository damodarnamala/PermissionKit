name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  build-ios:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build for iOS
        run: |
          xcodebuild build \
            -scheme PermissionKit \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation

  build-tvos:
    name: Build (tvOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build for tvOS
        run: |
          TVOS_SDK=$(xcrun --sdk appletvsimulator --show-sdk-path)
          TVOS_VER=$(xcrun --sdk appletvsimulator --show-sdk-version)
          find Sources/PermissionKit -name '*.swift' | \
            xargs swiftc -sdk "$TVOS_SDK" -target "arm64-apple-tvos${TVOS_VER}-simulator" -typecheck

  build-watchos:
    name: Build (watchOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build for watchOS
        run: |
          WATCH_SDK=$(xcrun --sdk watchsimulator --show-sdk-path)
          WATCH_VER=$(xcrun --sdk watchsimulator --show-sdk-version)
          find Sources/PermissionKit -name '*.swift' | \
            xargs swiftc -sdk "$WATCH_SDK" -target "arm64-apple-watchos${WATCH_VER}-simulator" -typecheck

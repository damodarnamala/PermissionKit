name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  build-ios:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build for iOS
        run: |
          xcodebuild build \
            -scheme PermissionKit \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation

  build-tvos:
    name: Build (tvOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build for tvOS
        run: |
          xcodebuild build \
            -scheme PermissionKit \
            -destination 'generic/platform=tvOS Simulator' \
            -skipPackagePluginValidation

  build-watchos:
    name: Build (watchOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Build for watchOS
        run: |
          xcodebuild build \
            -scheme PermissionKit \
            -destination 'generic/platform=watchOS Simulator' \
            -skipPackagePluginValidation
